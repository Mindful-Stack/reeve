name: cli
# The reeve CLI bundle (kb/ADR-0030): every supported target built on its own runner, run, and checked end to end
# (scripts/tests/cli-unix.sh, cli-windows.sh), then, on a push to main only, published once per CLI version as
# ghcr.io/mindful-stack/reeve-cli:<version>. The CLI version comes from scripts/cli-version.sh alone (R1); this file is
# not a CLI input, so a pin bump here asks nobody to update.
#
# In a called workflow the github context is the caller's, so `github.event_name == 'push'` means release.yml on a
# push to main: only that run looks the bundle up, skips the builds when it exists, and publishes. A pull request or a
# manual run always builds and checks every target and never touches the registry, so nothing runs first on main.
on:
  # What can change a binary, an installer, the renderer or these checks.
  pull_request:
    paths:
      - "crates/reeve/**"
      - "crates/reeve-protocol/**"
      - "crates/reeve-server/src/cli_dist.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".config/nextest.toml"
      - "scripts/cli-*.sh"
      - "scripts/tests/cli-*"
      - "deploy/cli/**"
      - ".github/workflows/cli.yml"
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: The CLI version, a 40-hex commit id.
        value: ${{ jobs.version.outputs.version }}
      digest:
        description: The bundle image's digest, published by this run or an earlier one.
        value: ${{ jobs.publish.outputs.digest || jobs.version.outputs.digest }}
permissions: { contents: read }
# Every run: block is `bash --noprofile --norc -eo pipefail {0}`, Git Bash on Windows (scripts/tests/workflows.sh).
defaults:
  run:
    shell: bash
jobs:
  version:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: read }
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.lookup.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: version
        run: |
          set -euo pipefail
          version=$(scripts/cli-version.sh)
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: github.event_name == 'push'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Published (a digest), not published ("not found": build it), or a registry failure, which fails the run and
      # never reads as "missing".
      - id: lookup
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ref=ghcr.io/mindful-stack/reeve-cli:$VERSION
          if digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>"$RUNNER_TEMP/err"); then
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected answer for $ref: $digest" >&2; exit 1; }
            echo "digest=$digest" >>"$GITHUB_OUTPUT"
            echo "bundle $VERSION is published: $digest"
          elif grep -q ': not found$' "$RUNNER_TEMP/err" && ! grep -qiE 'denied|unauthorized|forbidden' "$RUNNER_TEMP/err"; then
            echo "bundle $VERSION is not published: building it"
          else
            cat "$RUNNER_TEMP/err" >&2
            exit 1
          fi

  # One leg per target, each on its own operating system (R2). Always on a pull request or a manual run; on a release
  # run only when the bundle is missing.
  build:
    needs: version
    if: github.event_name != 'push' || needs.version.outputs.digest == ''
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    permissions: { contents: read }
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      # A second CLI version for the end-to-end update; never a real commit id.
      OTHER: "1111111111111111111111111111111111111111"
    steps:
      - name: keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: musl-gcc for ring's C code
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Rosetta, to run the x86_64 build on this arm64 runner
        if: matrix.target == 'x86_64-apple-darwin'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # Build A is what ships; build B (only the reeve crate recompiles) is where the end-to-end update goes.
      - name: build, run and check the binary
        id: build
        run: |
          set -euo pipefail
          path=$(scripts/cli-build.sh "$TARGET" "$VERSION" dist | tail -1)
          echo "file=${path##*/}" >>"$GITHUB_OUTPUT"
          scripts/cli-build.sh "$TARGET" "$OTHER" dist-b >/dev/null
      # PR A's update unit tests on Linux x86_64 and on Windows (real rename semantics): the platform_file arm, the
      # swap and its rollback, the backup naming and cleanup. Debug builds for the host.
      - name: the update unit tests
        if: matrix.target == 'x86_64-unknown-linux-musl' || runner.os == 'Windows'
        run: cargo test --locked -p reeve --lib commands::update
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: runner.os == 'Windows'
        with:
          install_args: aqua:nextest-rs/nextest/cargo-nextest
          cache: true
      # A running old build does not block the next update, a failure after the original moved puts it back, and a
      # running .exe is replaced byte for byte (.config/nextest.toml bounds this binary's parallelism).
      - name: the update swap and its rollback, on Windows
        if: runner.os == 'Windows'
        run: cargo nextest run --locked -p reeve --test update
      # Every leg: this leg's stamped binaries install (install.sh, or install.ps1 under both PowerShells) and update
      # from build A to build B against a loopback stand-in, asking for exactly this platform's file. On Windows also
      # the %APPDATA% configuration path.
      - name: install and update, end to end, with this leg's binaries
        env:
          FILE: ${{ steps.build.outputs.file }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            scripts/tests/cli-windows.sh "dist/$FILE" "$VERSION" "dist-b/$FILE" "$OTHER"
          else
            scripts/tests/cli-unix.sh "dist/$FILE" "$VERSION" "dist-b/$FILE" "$OTHER" "$TARGET"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: cli-${{ matrix.target }}
          path: dist/${{ steps.build.outputs.file }}
          if-no-files-found: error
          retention-days: 1

  # Release runs only: assembles the bundle and pushes it, one run per CLI version at a time (R1).
  publish:
    needs: [version, build]
    if: github.event_name == 'push' && needs.build.result == 'success'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    concurrency:
      group: reeve-cli-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.push.outputs.digest || steps.recheck.outputs.digest }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The version job's lookup, again under this job's group: an earlier run for this CLI version may have published
      # it since (both looked it up before either published). Then this run takes that digest and pushes nothing.
      - id: recheck
        run: |
          set -euo pipefail
          ref=ghcr.io/mindful-stack/reeve-cli:$VERSION
          if digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>"$RUNNER_TEMP/err"); then
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected answer for $ref: $digest" >&2; exit 1; }
            echo "digest=$digest" >>"$GITHUB_OUTPUT"
            echo "bundle $VERSION was published meanwhile: $digest"
          elif grep -q ': not found$' "$RUNNER_TEMP/err" && ! grep -qiE 'denied|unauthorized|forbidden' "$RUNNER_TEMP/err"; then
            echo "bundle $VERSION is still not published: publishing it"
          else
            cat "$RUNNER_TEMP/err" >&2
            exit 1
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: steps.recheck.outputs.digest == ''
        with:
          pattern: cli-*
          merge-multiple: true
          path: ${{ runner.temp }}/bundle
      - name: assemble the bundle
        if: steps.recheck.outputs.digest == ''
        run: |
          set -euo pipefail
          dir=$RUNNER_TEMP/bundle
          mapfile -t want < <(scripts/cli-build.sh --targets | while read -r t; do scripts/cli-build.sh --file "$t"; done | LC_ALL=C sort)
          mapfile -t have < <(find "$dir" -mindepth 1 -maxdepth 1 -printf '%P\n' | LC_ALL=C sort)
          [ "${have[*]}" = "${want[*]}" ] || { echo "the bundle must hold exactly: ${want[*]}; it holds: ${have[*]:-nothing}" >&2; exit 1; }
          (cd "$dir" && sha256sum -- "${want[@]}" >SHA256SUMS)
          printf '%s\n' "$VERSION" >"$dir/VERSION"
      # For both server platforms: the image is FROM scratch with only a COPY (no RUN), so no emulation is needed, and
      # `--build-context cli=docker-image://ghcr.io/mindful-stack/reeve-cli:<version>` resolves on an arm64 host too.
      - name: push the bundle
        id: push
        if: steps.recheck.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/bundle
          file: ${{ github.workspace }}/deploy/cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mindful-stack/reeve-cli:${{ needs.version.outputs.version }}
