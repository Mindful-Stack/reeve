name: cli
# The reeve CLI bundle (kb/ADR-0030): every supported target built on its own runner, run, and checked end to end
# (scripts/tests/cli-unix.sh, cli-windows.sh), assembled into the bundle image for linux/amd64 and linux/arm64, then, on
# a push to main only, published once per CLI version as ghcr.io/mindful-stack/reeve-cli:<version>. The CLI version
# comes from scripts/cli-version.sh alone (R1); this file is not a CLI input, so a pin bump here asks nobody to update.
# A release run holds release.yml's per-version lock for the whole of this workflow (its `cli` job), so the lookup, the
# builds, the assembly and the push of one CLI version never run twice at once; this file takes no lock of its own.
#
# In a called workflow the github context is the caller's, so `github.event_name == 'push'` means release.yml on a
# push to main: only that run skips the builds when the bundle exists, and only it pushes. A pull request or a manual
# run always builds, checks and assembles every target and never pushes, so the only step that first runs on main is
# the push itself. A pull request from this repository also runs the registry lookup, report-only, logged in with its
# GITHUB_TOKEN as a release run is (scripts/cli-bundle-lookup.sh): its answer for a version that is not published is
# proven before merge, and an authorization failure fails the pull request instead of every release.
#
# If GITHUB_TOKEN cannot create the reeve-cli package (the organization's package settings may forbid it), create it
# once by hand, then let this repository's workflows write it: with a classic token that has write:packages,
#   echo "$TOKEN" | docker login ghcr.io -u <you> --password-stdin
#   d=$(mktemp -d) && echo bootstrap >"$d/BOOTSTRAP" &&
#     docker buildx build --platform linux/amd64,linux/arm64 -f deploy/cli/Dockerfile \
#       -t ghcr.io/mindful-stack/reeve-cli:bootstrap --push "$d"
# then, in the package's settings: Manage Actions access, add this repository with the Write role, and set the
# visibility to public (deploy/README.md, CLI distribution). The `bootstrap` tag is no CLI version, so nothing uses it.
on:
  # What can change a binary, an installer, the renderer or these checks.
  pull_request:
    paths:
      - "crates/reeve/**"
      - "crates/reeve-protocol/**"
      - "crates/reeve-server/src/cli_dist.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".config/nextest.toml"
      - "scripts/cli-*.sh"
      - "scripts/tests/cli-*"
      - "deploy/cli/**"
      - ".github/workflows/cli.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      locked-version:
        description: The CLI version the caller holds its lock on; this run refuses to build any other.
        type: string
        required: true
    outputs:
      version:
        description: The CLI version, a 40-hex commit id.
        value: ${{ jobs.version.outputs.version }}
      digest:
        description: The bundle image's digest, published by this run or an earlier one.
        value: ${{ jobs.publish.outputs.digest || jobs.version.outputs.digest }}
permissions: { contents: read }
# A newer push to the same pull request supersedes its run in progress; every other run (a release run, whose run id
# is the caller's, or a manual one) has a group of its own.
concurrency:
  group: "cli-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Every run: block is `bash --noprofile --norc -eo pipefail {0}`, Git Bash on Windows (scripts/tests/workflows.sh).
defaults:
  run:
    shell: bash
jobs:
  version:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: read }
    env:
      LOOKUP: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.lookup.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: version
        env:
          LOCKED: ${{ inputs.locked-version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version=$(scripts/cli-version.sh)
          # Called from release.yml: the lock it holds must be this version's, or two runs could build one version. A
          # push run can publish, so it must hold a lock: an empty locked-version there would run unlocked.
          [ "$EVENT" != push ] || [ -n "$LOCKED" ] || { echo "a push run needs locked-version (release.yml's lock)" >&2; exit 1; }
          [ -z "$LOCKED" ] || [ "$LOCKED" = "$version" ] || { echo "locked on CLI version '$LOCKED', computed '$version'" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
      # The lookup gates the builds on a release run (inside release.yml's lock, so a run that waited sees what the
      # run before it published); on a pull request from this repository it only reports (the
      # builds run anyway), so a registry or token problem shows before merge. Fork pull requests have no token for it.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.LOOKUP == 'true'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.LOOKUP == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Published (a digest), clearly not published (build it), or anything else, which fails the run and never
      # reads as "missing".
      - id: lookup
        if: env.LOOKUP == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          answer=$(scripts/cli-bundle-lookup.sh "$VERSION")
          echo "bundle $VERSION: $answer"
          case "$answer" in
          "published "*) [ "$EVENT" != push ] || echo "digest=${answer#published }" >>"$GITHUB_OUTPUT" ;;
          missing) ;;
          *) echo "unexpected lookup answer: $answer" >&2; exit 1 ;;
          esac

  # One leg per target, each on its own operating system (R2). Always on a pull request or a manual run; on a release
  # run only when the bundle is missing.
  build:
    needs: version
    if: github.event_name != 'push' || needs.version.outputs.digest == ''
    timeout-minutes: 45
    strategy:
      # A release run stops at the first broken target (it would publish nothing); elsewhere every leg reports.
      fail-fast: ${{ github.event_name == 'push' }}
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    permissions: { contents: read }
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      # A second CLI version for the end-to-end update; never a real commit id.
      OTHER: "1111111111111111111111111111111111111111"
    steps:
      - name: keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: musl-gcc for ring's C code
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Rosetta, to run the x86_64 build on this arm64 runner
        if: matrix.target == 'x86_64-apple-darwin'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # Build A is what ships; build B (only the reeve crate recompiles) is where the end-to-end update goes.
      - name: build, run and check the binary
        id: build
        run: |
          set -euo pipefail
          path=$(scripts/cli-build.sh "$TARGET" "$VERSION" dist | tail -1)
          echo "file=${path##*/}" >>"$GITHUB_OUTPUT"
          scripts/cli-build.sh "$TARGET" "$OTHER" dist-b >/dev/null
      # PR A's update unit tests on Linux x86_64 and on Windows (real rename semantics): the platform_file arm, the
      # swap and its rollback, the backup naming and cleanup. Debug builds for the host.
      - name: the update unit tests
        if: matrix.target == 'x86_64-unknown-linux-musl' || runner.os == 'Windows'
        run: cargo test --locked -p reeve --lib commands::update
      # The print-site check walks src and compares paths by component, and terminal.rs's writers are tested against
      # failing streams in process; both run where paths and streams differ from Linux's. Debug builds for the host;
      # the x86_64 macOS leg runs on the same arm64 runner, so one macOS leg is enough.
      - name: the print-site check and the terminal writers
        if: runner.os == 'Windows' || matrix.target == 'aarch64-apple-darwin'
        run: |
          cargo test --locked -p reeve --test print_sites
          cargo test --locked -p reeve --lib terminal::
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: runner.os == 'Windows'
        with:
          install_args: aqua:nextest-rs/nextest/cargo-nextest
          cache: true
      # A running old build does not block the next update, a failure after the original moved puts it back, and a
      # running .exe is replaced byte for byte (.config/nextest.toml bounds this binary's parallelism).
      - name: the update swap and its rollback, on Windows
        if: runner.os == 'Windows'
        run: cargo nextest run --locked -p reeve --test update
      # Every leg: this leg's stamped binaries install (install.sh, or install.ps1 under both PowerShells) and update
      # from build A to build B against a loopback stand-in, asking for exactly this platform's file. On Windows also
      # the %APPDATA% configuration path.
      - name: install and update, end to end, with this leg's binaries
        env:
          FILE: ${{ steps.build.outputs.file }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            scripts/tests/cli-windows.sh "dist/$FILE" "$VERSION" "dist-b/$FILE" "$OTHER"
          else
            scripts/tests/cli-unix.sh "dist/$FILE" "$VERSION" "dist-b/$FILE" "$OTHER" "$TARGET"
          fi
      # On every run, so assembling the bundle is proven before main.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/${{ steps.build.outputs.file }}
          if-no-files-found: error
          retention-days: 1

  # Every run: the bundle from the legs' binaries, checked, and its image built for both platforms without a push. No
  # registry access. The bundle goes to publish as an artifact.
  assemble:
    needs: [version, build]
    if: needs.build.result == 'success'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cli-*
          merge-multiple: true
          path: ${{ runner.temp }}/bundle
      - name: assemble the bundle
        run: |
          set -euo pipefail
          dir=$RUNNER_TEMP/bundle
          mapfile -t want < <(scripts/cli-build.sh --targets | while read -r t; do scripts/cli-build.sh --file "$t"; done | LC_ALL=C sort)
          mapfile -t have < <(find "$dir" -mindepth 1 -maxdepth 1 -printf '%P\n' | LC_ALL=C sort)
          [ "${have[*]}" = "${want[*]}" ] || { echo "the bundle must hold exactly: ${want[*]}; it holds: ${have[*]:-nothing}" >&2; exit 1; }
          (cd "$dir" && sha256sum -- "${want[@]}" >SHA256SUMS)
          printf '%s\n' "$VERSION" >"$dir/VERSION"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Both server platforms: FROM scratch with only a COPY (no RUN), so no emulation is needed, and
      # `--build-context cli=docker-image://ghcr.io/mindful-stack/reeve-cli:<version>` resolves on an arm64 host too.
      - name: build the bundle image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/bundle
          file: ${{ github.workspace }}/deploy/cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 1

  # Release runs only: pushes the assembled bundle, under release.yml's per-version lock (no group here: one of the
  # same name would wait on the caller's forever). The lookup is repeated just before the push, so a bundle that
  # appeared since `version` looked (pushed by hand, outside a release run) is used, never overwritten.
  publish:
    needs: [version, assemble]
    if: github.event_name == 'push' && needs.assemble.result == 'success'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    outputs:
      digest: ${{ steps.push.outputs.digest || steps.recheck.outputs.digest }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: recheck
        run: |
          set -euo pipefail
          answer=$(scripts/cli-bundle-lookup.sh "$VERSION")
          echo "bundle $VERSION: $answer"
          case "$answer" in
          "published "*) echo "digest=${answer#published }" >>"$GITHUB_OUTPUT" ;;
          missing) ;;
          *) echo "unexpected lookup answer: $answer" >&2; exit 1 ;;
          esac
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: steps.recheck.outputs.digest == ''
        with:
          name: bundle
          path: ${{ runner.temp }}/bundle
      # What assemble checked, again on the bytes this job pushes.
      - name: check the bundle
        if: steps.recheck.outputs.digest == ''
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bundle"
          [ "$(cat VERSION)" = "$VERSION" ] || { echo "the bundle's VERSION is '$(cat VERSION)', want '$VERSION'" >&2; exit 1; }
          sha256sum --strict -c SHA256SUMS
      - name: push the bundle
        id: push
        if: steps.recheck.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/bundle
          file: ${{ github.workspace }}/deploy/cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mindful-stack/reeve-cli:${{ needs.version.outputs.version }}
