services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: reeve
      POSTGRES_PASSWORD: reeve
      POSTGRES_DB: reeve
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["reeve-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reeve -d reeve"]
      interval: 2s
      timeout: 3s
      retries: 30
  server:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REEVE_CONFIG: /etc/reeve/reeve.toml
      # For the scheduled decision check run inside this container (deploy/README.md, "Scheduled decision check"): the
      # CLI reaches this server on its own port, and the household of clones lives in its own volume, which the server
      # process never reads.
      REEVE_URL: http://127.0.0.1:7474
      REEVE_HOUSEHOLD: /var/lib/reeve/household
    volumes:
      - ./reeve.toml:/etc/reeve/reeve.toml:ro
      - reeve-household:/var/lib/reeve/household
    ports: ["127.0.0.1:7474:7474"]
volumes:
  reeve-pg: {}
  reeve-household: {}
