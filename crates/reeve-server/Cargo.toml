[package]
name = "reeve-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "reeve-server"
path = "src/main.rs"

[features]
static-oidc = ["reeve-identity/static-oidc"]

[dependencies]
reeve-protocol.workspace = true
reeve-planning.workspace = true
reeve-identity.workspace = true
reeve-activity.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
axum.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
axum-extra.workspace = true
time.workspace = true
url.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
hmac.workspace = true
urlencoding.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
base64.workspace = true
reqwest.workspace = true
uuid.workspace = true
bytes.workspace = true

[dev-dependencies]
tower.workspace = true
testcontainers-modules.workspace = true
reeve-testdb.workspace = true
tempfile.workspace = true
image.workspace = true
img-parts.workspace = true
# Test-only: the official SDK's client, for tests/mcp_conformance.rs. Never a dependency of the binary (kb/ADR-0006 R1).
rmcp = { version = "3.10.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
