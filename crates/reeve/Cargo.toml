[package]
name = "reeve"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "reeve"
path = "src/lib.rs"

[[bin]]
name = "reeve"
path = "src/main.rs"

[dependencies]
reeve-protocol.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
clap.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
futures-util.workspace = true
base64.workspace = true
uuid.workspace = true
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true
reeve-server.workspace = true
reeve-identity.workspace = true
reeve-activity.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["net", "time", "macros", "rt-multi-thread", "process", "test-util"] }
sqlx.workspace = true
reeve-testdb.workspace = true
portable-pty = "0.9"

# `MasterPty::get_termios` returns portable-pty's nix type: the version portable-pty 0.9 uses, with `term`.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.28", features = ["term"] }
