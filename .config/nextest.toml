# cargo-nextest (mise.toml [tools]). `mise run test` and its siblings use this default profile, locally and in CI.
[profile.default]
# Every failure is reported and none is retried: a flaky test stays visible.
fail-fast = false
retries = 0
# A hung test fails after six minutes: later than the 300 s timeouts acceptance.rs, tui_e2e.rs and jira_import.rs
# wrap their flows in, so their own message is the one reported.
slow-timeout = { period = "60s", terminate-after = 6 }
